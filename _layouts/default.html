<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="icon" type="image/png" href="{{ '/images/favicon-64.png' | relative_url }}">
  <meta name="theme-color" content="#14223d">
  {% include analytics_head.html %}
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="{{ '/' | relative_url }}">
        <img src="{{ site.avatar | relative_url }}" alt="">
        <span>{{ site.name }}</span>
      </a>
      <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav">Menu</button>
      <nav class="nav" id="site-nav" aria-label="Main">
        {% for item in site.data.nav %}
        <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
        {% endfor %}
        <a class="btn btn-primary btn-small" href="mailto:{{ site.email }}">Contact</a>
      </nav>
    </div>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p style="margin:0">© {{ site.time | date: "%Y" }} {{ site.name }} · {{ site.location }}</p>
      {% include social.html %}
    </div>
  </footer>

  <script>
    (function () {
      var b = document.querySelector('.nav-toggle'), n = document.getElementById('site-nav');
      if (!b || !n) return;
      b.addEventListener('click', function () {
        var open = n.classList.toggle('open');
        b.setAttribute('aria-expanded', open);
        b.textContent = open ? 'Close' : 'Menu';
      });
    })();
  </script>
</body>
</html>
