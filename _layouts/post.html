---
layout: default
---
<article>
  <header class="page-hero">
    <div class="container">
      <span class="eyebrow">{% if page.categories.size > 0 %}{{ page.categories | join: " · " }}{% else %}Posts{% endif %}</span>
      <h1 style="max-width:22ch">{{ page.title }}</h1>
      <p class="post-meta">{{ site.name }} · <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
    </div>
  </header>
  <div class="section">
    <div class="container">
      <div class="prose">
        {{ content }}
      </div>
      <p style="margin-top:48px"><a href="{{ '/posts/' | relative_url }}">← All posts</a></p>
    </div>
  </div>
</article>
